# Internal Container Nginx Config
# This file lives INSIDE the Docker image

# ----------------------------------------------------
# 1. HTTP → HTTPS Redirect (Internal)
# ----------------------------------------------------
server {
    listen 80;
    server_name prod.sigmasoftinfotech.com;
    return 301 https://$host$request_uri;
}

# ----------------------------------------------------
# 2. Main HTTPS Server
# ----------------------------------------------------
server {
    listen 443 ssl http2;
    server_name prod.sigmasoftinfotech.com;

    # SSL Certificates (Volume-mapped into the container)
    ssl_certificate     /etc/ssl/certs/sigmasoftinfotech_fullchain.crt;
    ssl_certificate_key /etc/ssl/private/sigmasoftinfotech.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # ================= CONNECTADO OUTLOOK =================
    location /connectado_outlook/ {
        alias /usr/share/nginx/html/connectado_outlook/;
        index taskpane.html;
        try_files $uri $uri/ /connectado_outlook/taskpane.html;
    }

    # Redirect root to the app
    location = / {
        return 301 /connectado_outlook/;
    }

    # Errors
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
