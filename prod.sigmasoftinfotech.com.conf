# HTTP → HTTPS Redirect
server {
    listen 80;
    server_name prod.sigmasoftinfotech.com;

    # Redirect all HTTP requests to HTTPS securely
    return 301 https://$host$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name prod.sigmasoftinfotech.com;

    # Ensure these paths exactly match where your certs are on the PROD server
    ssl_certificate     /etc/ssl/certs/sigmasoftinfotech_fullchain.crt;
    ssl_certificate_key /etc/ssl/private/sigmasoftinfotech.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # ================= CONNECTADO OUTLOOK =================
    location /connectado_outlook/ {
        # Proxy to Docker Swarm's HTTPS listener
        proxy_pass https://127.0.0.1:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional root fallback matching Outlook Add-in path
    location = / {
        return 301 /connectado_outlook/;
    }

    # Standard error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
